    <!-- Handle redirects from 404.html -->
    <script>
      (function() {
        // Check if we need to redirect
        const redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          // Remove the redirect from session storage
          sessionStorage.removeItem('redirect');
          
          // Only redirect if we're on the base path
          if (window.location.pathname.endsWith('/pingpal') || 
              window.location.pathname.endsWith('/pingpal/')) {
            // Redirect to the saved URL
            window.history.replaceState(null, null, '/pingpal/' + redirect);
          }
        }
      })();
    </script>
